# ============================================================================
#  docker-compose.yml — l'environnement du TP CI/CD Symfony
# ============================================================================
#  Un seul service « php » : l'image construite depuis le Dockerfile du
#  dossier, le projet monté en /srv/app, et le serveur PHP accessible sur
#  127.0.0.1:8000.
# ============================================================================

services:
  php:
    build: .
    container_name: ci-symfony
    working_dir: /srv/app
    volumes:
      - ".:/srv/app"
    ports:
      - "127.0.0.1:8000:8000"
    command: php -S 0.0.0.0:8000 -t public public/index.php